name: Build firmware

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.h is git-ignored; CI uses the example so the sketch compiles.
      - name: Provide config.h for CI
        run: cp src/septic_lift_monitor/config.h.example src/septic_lift_monitor/config.h

      - name: Compile for ESP32
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32"
          platforms: |
            - name: "esp32:esp32"
              source-url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          libraries: |
            - name: "ArduinoJson"
            - name: "ADS1X15"
          sketch-paths: |
            - src/septic_lift_monitor
          enable-warnings-report: true
